name: Jetson script simulation

on:
  push:
    paths:
      - '**.sh'
      - 'tests/**'
      - '.github/workflows/jetson-script-simulation.yml'
  pull_request:
    paths:
      - '**.sh'
      - 'tests/**'
      - '.github/workflows/jetson-script-simulation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jetson-script-simulation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Run safe script simulations
        run: bash tests/simulate.sh 2>&1 | tee jetson-simulation.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: jetson-script-diagnostics
          path: jetson-simulation.log
          if-no-files-found: ignore
